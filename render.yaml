services:
  - type: web
    name: connect-digitals-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build && npm run db:migrate:deploy && npx prisma generate
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      # Webhook URL = this Render service's public URL + /bot/webhook
      # Set this in the Render dashboard to: https://connect-digitals-api.onrender.com/bot/webhook
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
